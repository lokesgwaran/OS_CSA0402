services:
  portal:
    build: ../TaskB2_Containerise_Portal
    ports: ["8000:8000"]
    cpus: "0.50"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on: [db]

  lms-service:
    image: python:3.12-slim
    command: python3 -m http.server 8080
    ports: ["8080:8080"]
    cpus: "0.25"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 15s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: change-this-demo-password
      POSTGRES_DB: results
    volumes: [dbdata:/var/lib/postgresql/data]
    cpus: "1.0"
    mem_limit: 1g

volumes:
  dbdata:
