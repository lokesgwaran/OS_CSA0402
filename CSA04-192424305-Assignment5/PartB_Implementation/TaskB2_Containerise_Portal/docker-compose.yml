services:
  portal:
    build: .
    ports: ["8000:8000"]
    cpus: "0.50"
    mem_limit: 512m
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: change-this-demo-password
      POSTGRES_DB: results
    volumes: [dbdata:/var/lib/postgresql/data]
    cpus: "1.0"
    mem_limit: 1g
volumes:
  dbdata:
